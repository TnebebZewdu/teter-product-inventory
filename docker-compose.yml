services:
  db:
    image: postgres:18-alpine
    container_name: teter-inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: teter_inventory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teter_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teter-inventory-api
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD_URLENCODED}@db:5432/teter_inventory?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
